services:
  - type: web
    name: medical-appointments-api
    env: ruby
    region: oregon
    plan: free
    buildCommand: bundle install && rails db:migrate
    startCommand: bundle exec rails server -p $PORT
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
databases:
  - name: postgres
    type: postgresql
    plan: free
    version: 18
