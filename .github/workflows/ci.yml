name: CI/CD

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Pokrece PostgreSQL kontejner
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.x' # Prilagodite vasoj verziji Rubija

    - name: Install dependencies
      run: bundle install

    - name: Prepare database
      run: |
        # Postavlja ENV varijable da se podudaraju sa servisom iznad
        export PGHOST=localhost
        export PGUSER=postgres
        export PGPASSWORD=postgres
        export PGDATABASE=rails_test

        # Kreira i migrira bazu
        rails db:create
        rails db:migrate

    - name: Run tests
      run: bundle exec rspec
      env:
        # Prosledjuje ENV varijable RSpec komandi
        PGHOST: localhost
        PGUSER: postgres
        PGPASSWORD: postgres
        PGDATABASE: rails_test
